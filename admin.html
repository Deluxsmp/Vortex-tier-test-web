<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vortex Tier — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #050505;
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #aaa;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      background: #080808;
      color: #fff;
      border: 1px solid #303030;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      border-color: #666;
    }

    button {
      border: 0;
      cursor: pointer;
      color: white;
      font-weight: 800;
    }

    .login-btn,
    .primary-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: #fff;
      color: #000;
      margin-top: 15px;
    }

    .error {
      color: #ff6565;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* ADMIN */

    .admin {
      min-height: 100vh;
      padding: 25px;
      max-width: 1200px;
      margin: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 28px;
    }

    .logout {
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 10px 16px;
      border-radius: 10px;
    }

    .card {
      background: #101010;
      border: 1px solid #282828;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 19px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      margin-bottom: 5px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .save-btn {
      background: #fff;
      color: #000;
      padding: 12px 18px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .players {
      display: grid;
      gap: 10px;
    }

    .player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      background: #080808;
      border: 1px solid #252525;
      border-radius: 12px;
      padding: 14px;
    }

    .player-name {
      font-weight: 800;
    }

    .player-meta {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .edit-btn,
    .delete-btn {
      padding: 9px 13px;
      border-radius: 8px;
      background: #191919;
      border: 1px solid #333;
    }

    .delete-btn {
      color: #ff6969;
    }

    .mode-results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .mode-box {
      background: #080808;
      border: 1px solid #252525;
      padding: 14px;
      border-radius: 12px;
    }

    .mode-title {
      font-weight: 800;
      margin-bottom: 10px;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #8cff9a;
    }

    @media (max-width: 700px) {
      .admin {
        padding: 15px;
      }

      .grid,
      .mode-results {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
      }

      .player {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <section id="loginPage" class="login-page">

    <div class="login-box">

      <div class="logo">Vortex Tier</div>
      <div class="subtitle">Administrator Login</div>

      <form id="loginForm">

        <label for="password">
          Admin Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Enter admin password"
          autocomplete="off"
          required
        >

        <button
          type="submit"
          class="login-btn"
        >
          Login
        </button>

        <div id="loginError" class="error">
          Incorrect password.
        </div>

      </form>

    </div>

  </section>


  <!-- =========================
       ADMIN PANEL
  ========================== -->

  <main id="adminPanel" class="admin hidden">

    <div class="topbar">

      <div>
        <h1>Admin Panel</h1>
        <div class="subtitle">
          Vortex Tier Management
        </div>
      </div>

      <button
        id="logoutBtn"
        class="logout"
      >
        Logout
      </button>

    </div>


    <!-- ADD / EDIT PLAYER -->

    <section class="card">

      <h2 id="formTitle">
        Add Player
      </h2>

      <form id="playerForm">

        <input
          type="hidden"
          id="editIndex"
          value=""
        >

        <div class="grid">

          <div class="field">

            <label>
              Player Name
            </label>

            <input
              id="playerName"
              type="text"
              placeholder="Minecraft username"
              required
            >

          </div>


          <div class="field">

            <label>
              Region
            </label>

            <input
              id="playerRegion"
              type="text"
              placeholder="e.g. AS"
            >

          </div>


          <div class="field">

            <label>
              Skin URL (optional)
            </label>

            <input
              id="playerSkin"
              type="text"
              placeholder="https://..."
            >

          </div>


          <div class="field">

            <label>
              NameMC URL (optional)
            </label>

            <input
              id="playerNamemc"
              type="text"
              placeholder="https://namemc.com/..."
            >

          </div>

        </div>


        <h3 style="margin-top:25px;">
          Gamemode Results
        </h3>

        <div
          id="modeResults"
          class="mode-results"
        ></div>


        <button
          type="submit"
          class="save-btn"
        >
          Save Player
        </button>

        <button
          type="button"
          id="cancelEdit"
          class="save-btn hidden"
          style="background:#191919;color:#fff;margin-left:8px;"
        >
          Cancel Edit
        </button>


        <div
          id="saveStatus"
          class="status"
        ></div>

      </form>

    </section>


    <!-- PLAYERS -->

    <section class="card">

      <h2>
        Players
      </h2>

      <div
        id="playersList"
        class="players"
      ></div>

    </section>

  </main>


<script>

/* =========================================================
   ADMIN PASSWORD
   Change this password to your own password.
   ========================================================= */

const ADMIN_PASSWORD = "CHANGE_THIS_PASSWORD";


/* =========================================================
   MODES
   ========================================================= */

const MODES = [
  {
    id: "vanilla",
    name: "Vanilla"
  },
  {
    id: "uhc",
    name: "UHC"
  },
  {
    id: "pot",
    name: "Pot"
  },
  {
    id: "nethop",
    name: "NetHop"
  },
  {
    id: "smp",
    name: "SMP"
  },
  {
    id: "sword",
    name: "Sword"
  },
  {
    id: "axe",
    name: "Axe"
  },
  {
    id: "mace",
    name: "Mace"
  }
];


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginPage = document.getElementById("loginPage");
const adminPanel = document.getElementById("adminPanel");

const loginForm = document.getElementById("loginForm");
const passwordInput = document.getElementById("password");
const loginError = document.getElementById("loginError");

const logoutBtn = document.getElementById("logoutBtn");

const playerForm = document.getElementById("playerForm");
const playersList = document.getElementById("playersList");

const modeResults = document.getElementById("modeResults");

const formTitle = document.getElementById("formTitle");
const editIndex = document.getElementById("editIndex");

const playerName = document.getElementById("playerName");
const playerRegion = document.getElementById("playerRegion");
const playerSkin = document.getElementById("playerSkin");
const playerNamemc = document.getElementById("playerNamemc");

const cancelEdit = document.getElementById("cancelEdit");
const saveStatus = document.getElementById("saveStatus");


/* =========================================================
   IMPORTANT:
   NO SESSION STORAGE.
   NO LOCAL LOGIN MEMORY.
   
   Every time admin.html loads,
   login screen is shown.
   ========================================================= */

function showLogin(){

  loginPage.classList.remove("hidden");

  adminPanel.classList.add("hidden");

  passwordInput.value = "";

}


function showAdmin(){

  loginPage.classList.add("hidden");

  adminPanel.classList.remove("hidden");

  renderPlayers();

}


/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener("submit", function(e){

  e.preventDefault();

  const password = passwordInput.value;

  if(password === ADMIN_PASSWORD){

    loginError.style.display = "none";

    showAdmin();

  }else{

    loginError.style.display = "block";

    passwordInput.value = "";

    passwordInput.focus();

  }

});


/* =========================================================
   LOGOUT
   ========================================================= */

logoutBtn.addEventListener("click", function(){

  showLogin();

});


/* =========================================================
   MODE INPUTS
   ========================================================= */

function createModeInputs(){

  modeResults.innerHTML = MODES.map(mode => {

    return `
      <div class="mode-box">

        <div class="mode-title">
          ${mode.name}
        </div>

        <label>
          Tier
        </label>

        <select
          data-tier="${mode.id}"
        >
          <option value="">Untested</option>
          <option value="HT1">HT1</option>
          <option value="LT1">LT1</option>
          <option value="HT2">HT2</option>
          <option value="LT2">LT2</option>
          <option value="HT3">HT3</option>
          <option value="LT3">LT3</option>
          <option value="HT4">HT4</option>
          <option value="LT4">LT4</option>
          <option value="HT5">HT5</option>
          <option value="LT5">LT5</option>
        </select>

        <label style="margin-top:10px;">
          Points
        </label>

        <input
          type="number"
          min="0"
          step="1"
          data-points="${mode.id}"
          placeholder="0"
        >

      </div>
    `;

  }).join("");

}


/* =========================================================
   DATA
   ========================================================= */

function getPlayers(){

  try{

    return JSON.parse(
      localStorage.getItem("vortexPlayers") || "[]"
    );

  }catch{

    return [];

  }

}


function savePlayers(players){

  localStorage.setItem(
    "vortexPlayers",
    JSON.stringify(players)
  );

}


/* =========================================================
   ADD PLAYER
   ========================================================= */

playerForm.addEventListener("submit", function(e){

  e.preventDefault();

  const players = getPlayers();

  const name = playerName.value.trim();

  if(!name){
    return;
  }


  const results = {};

  MODES.forEach(mode => {

    const tierElement =
      document.querySelector(
        `[data-tier="${mode.id}"]`
      );

    const pointsElement =
      document.querySelector(
        `[data-points="${mode.id}"]`
      );

    const tier = tierElement.value;

    const points =
      Number(pointsElement.value || 0);


    results[mode.id] = {
      tier: tier,
      points: points
    };

  });


  const player = {

    name: name,

    region:
      playerRegion.value.trim(),

    skin:
      playerSkin.value.trim(),

    namemc:
      playerNamemc.value.trim(),

    results: results

  };


  const index = editIndex.value;


  if(index !== ""){

    players[Number(index)] = player;

    saveStatus.textContent =
      "Player updated successfully.";

  }else{

    players.push(player);

    saveStatus.textContent =
      "Player added successfully.";

  }


  savePlayers(players);

  resetForm();

  renderPlayers();

});


/* =========================================================
   RENDER PLAYERS
   ========================================================= */

function renderPlayers(){

  const players = getPlayers();

  if(players.length === 0){

    playersList.innerHTML = `
      <div style="color:#777;">
        No players added yet.
      </div>
    `;

    return;

  }


  playersList.innerHTML =
    players.map((player, index) => {

      return `

        <div class="player">

          <div>

            <div class="player-name">
              ${escapeHTML(player.name)}
            </div>

            <div class="player-meta">
              ${escapeHTML(player.region || "No region")}
            </div>

          </div>

          <div class="actions">

            <button
              class="edit-btn"
              onclick="editPlayer(${index})"
            >
              Edit
            </button>

            <button
              class="delete-btn"
              onclick="deletePlayer(${index})"
            >
              Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================================================
   EDIT PLAYER
   ========================================================= */

window.editPlayer = function(index){

  const players = getPlayers();

  const player = players[index];

  if(!player){
    return;
  }


  editIndex.value = index;

  playerName.value =
    player.name || "";

  playerRegion.value =
    player.region || "";

  playerSkin.value =
    player.skin || "";

  playerNamemc.value =
    player.namemc || "";


  MODES.forEach(mode => {

    const result =
      player.results?.[mode.id] || {};

    const tierElement =
      document.querySelector(
        `[data-tier="${mode.id}"]`
      );

    const pointsElement =
      document.querySelector(
        `[data-points="${mode.id}"]`
      );


    tierElement.value =
      result.tier || "";

    pointsElement.value =
      result.points || "";

  });


  formTitle.textContent =
    "Edit Player";

  cancelEdit.classList.remove("hidden");

  saveStatus.textContent = "";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};


/* =========================================================
   DELETE PLAYER
   ========================================================= */

window.deletePlayer = function(index){

  const players = getPlayers();

  if(!players[index]){
    return;
  }


  const playerNameConfirm =
    players[index].name;


  if(!confirm(
    `Delete ${playerNameConfirm}?`
  )){
    return;
  }


  players.splice(index, 1);

  savePlayers(players);

  renderPlayers();

};


/* =========================================================
   CANCEL EDIT
   ========================================================= */

cancelEdit.addEventListener("click", function(){

  resetForm();

});


/* =========================================================
   RESET FORM
   ========================================================= */

function resetForm(){

  playerForm.reset();

  editIndex.value = "";

  formTitle.textContent =
    "Add Player";

  cancelEdit.classList.add("hidden");

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   START
   ========================================================= */

createModeInputs();

/*
  VERY IMPORTANT:
  Never automatically open admin panel.
  Always show password screen when the page loads.
*/

showLogin();

</script>

</body>
</html>
