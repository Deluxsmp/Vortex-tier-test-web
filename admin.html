<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vortex Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060913;color:#f8fafc;font-family:Inter,Arial,sans-serif}header{padding:18px 5%;border-bottom:1px solid #1e263d;display:flex;justify-content:space-between;align-items:center;background:#0a0e19;position:sticky;top:0;z-index:5}.brand{font-size:22px;font-weight:900;color:#facc15}.hidden{display:none!important}.wrap{width:min(1250px,92%);margin:28px auto}.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}.card{background:#0d1220;border:1px solid #1e263d;border-radius:14px;padding:20px;box-shadow:0 8px 30px #0007}input,select{width:100%;padding:11px 12px;margin:5px 0 12px;background:#060913;border:1px solid #26304a;border-radius:8px;color:#fff}label{font-size:12px;color:#94a3b8;font-weight:800}button{padding:10px 14px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-weight:800;cursor:pointer}button.danger{background:#ef4444}.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.modebox{padding:10px;border:1px solid #1e263d;border-radius:10px;background:#0a0f1b}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#94a3b8;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.stat{background:#0d1220;border:1px solid #1e263d;border-radius:12px;padding:15px}.stat b{display:block;font-size:24px}.icon-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.players{display:grid;gap:8px}.player{padding:13px;border:1px solid #1e263d;border-radius:10px;background:#101827;cursor:pointer}.player:hover{border-color:#818cf8}@media(max-width:850px){.grid{grid-template-columns:1fr}.modes{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="brand">VORTEX TIER • ADMIN</div><button onclick="logout()">Logout</button></header>
<div class="wrap">
<div id="login" class="card" style="max-width:420px;margin:80px auto"><h2>Admin Login</h2><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg" class="muted"></p></div>
<div id="panel" class="hidden">
<div class="stats"><div class="stat">Players<b id="count">0</b></div><div class="stat">Ranked<b id="ranked">0</b></div><div class="stat">Tests<b id="tests">0</b></div><div class="stat">Modes<b>8</b></div></div>
<div class="grid"><section class="card"><div class="top"><h2>Players</h2><button onclick="newPlayer()">+ Add</button></div><input id="search" placeholder="Search player..." oninput="renderPlayers()"><div id="players" class="players"></div></section>
<section class="card"><h2 id="formTitle">Add Player</h2><form onsubmit="event.preventDefault();saveForm()"><label>Player Name</label><input id="name" required><label>Region</label><input id="region" placeholder="NA / EU / ME / AS"><label>Custom Skin URL (optional)</label><input id="skinUrl" placeholder="Leave empty for automatic username skin"><h3>Gamemodes</h3><div class="modes" id="modes"></div><div style="margin-top:16px;display:flex;gap:8px"><button>Save Player</button><button type="button" class="danger" onclick="deleteCurrent()">Delete</button></div></form><hr style="border-color:#1e263d;margin:24px 0"><h3>Mode Images</h3><p class="muted">Optional image URL for each mode.</p><div id="icons" class="icon-row"></div><button onclick="saveIcons()" style="margin-top:12px">Save Images</button><hr style="border-color:#1e263d;margin:24px 0"><p class="muted">No database/API/token. Saving here generates the updated app.js.</p><button onclick="downloadApp()">Download updated app.js</button></section></div></div></div>
<script>
const ADMIN_PASSWORD="vortex123";
const MODES=[['vanilla','Vanilla'],['uhc','UHC'],['pot','Pot'],['nethop','NetHop'],['smp','SMP'],['sword','Sword'],['axe','Axe'],['mace','Mace']];
const ICONS=['vanilla','uhc','pot','nethop','smp','sword','axe','mace'];
let DATA={modes:[{id:'overall',n:'Overall',i:'🏆'},{id:'vanilla',n:'Vanilla',i:'🟪'},{id:'uhc',n:'UHC',i:'❤️'},{id:'pot',n:'Pot',i:'🧪'},{id:'nethop',n:'NetHop',i:'🟣'},{id:'smp',n:'SMP',i:'🟢'},{id:'sword',n:'Sword',i:'🗡️'},{id:'axe',n:'Axe',i:'🪓'},{id:'mace',n:'Mace',i:'🔨'}],icons:{},site:{siteName:'Vortex Tier',discordUrl:'https://discord.com',serverIp:'mc.vortextier.net'},players:[]};
let editing=-1;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function login(){if($('password').value===ADMIN_PASSWORD){sessionStorage.vtx='1';$('login').classList.add('hidden');$('panel').classList.remove('hidden');render()}else $('msg').textContent='Wrong password.'}
function logout(){sessionStorage.removeItem('vtx');location.reload()}
if(sessionStorage.vtx==='1'){$('login').classList.add('hidden');$('panel').classList.remove('hidden')}
$('modes').innerHTML=MODES.map(([id,n])=>`<div class="modebox"><label>${n}</label><input id="tier_${id}" placeholder="HT1 / LT1"><input id="pts_${id}" type="number" placeholder="Points"></div>`).join('');
$('icons').innerHTML=ICONS.map(id=>`<div><label>${id}</label><input id="icon_${id}" placeholder="Image URL"></div>`).join('');
function render(){renderPlayers();renderForm()}
function renderPlayers(){let q=$('search').value.toLowerCase();$('players').innerHTML=DATA.players.map((p,i)=>({...p,i})).filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<div class="player" onclick="editPlayer(${p.i})"><b>${esc(p.name)}</b><br><span class="muted">${p.totalPoints||0} points • ${esc(p.combatRank||'Unranked')}</span></div>`).join('')||'<p class="muted">No players.</p>';$('count').textContent=DATA.players.length;$('ranked').textContent=DATA.players.filter(p=>p.totalPoints>0).length;$('tests').textContent=DATA.players.reduce((s,p)=>s+Object.values(p.results||{}).filter(r=>r&&((r.tier)||(r.points!==null&&r.points!==undefined&&r.points!==''))).length,0)}
function renderForm(){if(editing<0){clearForm();return}editPlayer(editing)}
function editPlayer(i){editing=i;const p=DATA.players[i];$('formTitle').textContent='Edit Player';$('name').value=p.name||'';$('region').value=p.region||'';$('skinUrl').value=p.skinUrl||'';MODES.forEach(([id])=>{$('tier_'+id).value=p.results?.[id]?.tier||'';$('pts_'+id).value=p.results?.[id]?.points??''});ICONS.forEach(id=>$('icon_'+id).value=DATA.icons?.[id]||'')}
function newPlayer(){editing=-1;clearForm()}
function clearForm(){$('formTitle').textContent='Add Player';['name','region','skinUrl'].forEach(id=>$(id).value='');MODES.forEach(([id])=>{$('tier_'+id).value='';$('pts_'+id).value=''})}
function saveForm(){const name=$('name').value.trim();if(!name)return;let p={id:editing>=0?DATA.players[editing].id:Date.now(),name,region:$('region').value.trim(),skinUrl:$('skinUrl').value.trim(),results:{},totalPoints:0,position:0};MODES.forEach(([id])=>{let tier=$('tier_'+id).value.trim().toUpperCase();let raw=$('pts_'+id).value; if(tier||raw!==''){p.results[id]={tier,points:raw===''?null:Number(raw)};p.totalPoints+=raw===''?0:Number(raw)}});let existing=DATA.players.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());if(existing>=0&&existing!==editing)editing=existing;if(editing>=0)DATA.players[editing]=p;else DATA.players.push(p);recalc();newPlayer();renderPlayers();alert('Saved. Now click Download updated app.js.');}
function deleteCurrent(){if(editing<0)return;if(confirm('Delete '+DATA.players[editing].name+'?')){DATA.players.splice(editing,1);recalc();newPlayer();renderPlayers()}}
function recalc(){DATA.players.sort((a,b)=>(b.totalPoints||0)-(a.totalPoints||0));DATA.players.forEach((p,i)=>{p.position=i+1;p.combatRank=i===0?'Combat Grandmaster':i<3?'Combat Master':'Combat Ace'});}
function saveIcons(){ICONS.forEach(id=>{const v=$('icon_'+id).value.trim();if(v)DATA.icons[id]=v;else delete DATA.icons[id]});alert('Images saved. Download app.js to apply them.')}
