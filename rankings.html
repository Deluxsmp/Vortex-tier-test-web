<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rankings — Vortex Tier</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">VORTEX <span>TIER</span></div>
  <a href="index.html">Home</a>
</header>
<main class="page">
  <div class="top">
    <div><p class="eyebrow">PLAYER RANKINGS</p><h1>Overall Rankings</h1></div>
    <select id="mode"></select>
  </div>
  <section id="rankings"></section>
</main>
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>
<script src="app.js"></script>
<script>
const modes = ["Overall","Vanilla","UHC","Pot","NetHop","SMP","Sword","Axe","Mace"];
const modeEl = document.getElementById("mode");
modes.forEach(m => modeEl.add(new Option(m,m)));
modeEl.value = "Overall";
modeEl.onchange = render;
render();

function tierValue(t){
  if(!t) return "";
  return t;
}
function rankOrder(t){
  if(!t) return 999;
  const m=t.match(/([HL])T([1-5])/i);
  return m ? Number(m[2])*10 + (m[1].toUpperCase()==="L"?1:0) : 999;
}
function playerTier(p,m){
  if(m==="Overall") return p.combatRank || "";
  return (p.modes && p.modes[m] && p.modes[m].tier) || "";
}
function render(){
  const selected=modeEl.value;
  const list=[...VORTEX_PLAYERS];
  if(selected==="Overall"){
    list.sort((a,b)=>(b.totalPoints||0)-(a.totalPoints||0));
    document.getElementById("rankings").innerHTML=list.map((p,i)=>row(p,i+1,selected)).join("");
  }else{
    const tiers=["HT1","LT1","HT2","LT2","HT3","LT3","HT4","LT4","HT5","LT5"];
    let html="";
    for(let n=1;n<=5;n++){
      html+=`<div class="tier-col"><h2>Tier ${n}</h2>`;
      for(const t of tiers.filter(x=>x.endsWith(String(n)))){
        const ps=list.filter(p=>playerTier(p,selected)===t);
        if(ps.length) html+=ps.map((p)=>smallRow(p,t)).join("");
      }
      html+="</div>";
    }
    document.getElementById("rankings").innerHTML=`<div class="tier-grid">${html}</div>`;
  }
}
function row(p,n){
  const cls=n===1?"gold":n===2?"silver":n===3?"bronze":"";
  return `<article class="player-row ${cls}" onclick="openModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
    <div class="num">#${n}</div>
    <div class="skin-wrap"><img src="${escapeAttr(p.skin||skin(p.name))}" onerror="this.src='https://mc-heads.net/avatar/Steve/80'"></div>
    <div class="info"><strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.region||"—")}</small></div>
    <div class="modes">${modes.slice(1).map(m=>badge(p,m)).join("")}</div>
    <div class="points">${p.totalPoints||0} pts</div>
  </article>`;
}
function smallRow(p,t){
  return `<div class="small-row" onclick="openModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
    <img src="${escapeAttr(p.skin||skin(p.name))}" onerror="this.src='https://mc-heads.net/avatar/Steve/60'">
    <span>${escapeHtml(p.name)}</span><b>${t}</b>
  </div>`;
}
function badge(p,m){
  const x=p.modes&&p.modes[m];
  return x&&x.tier ? `<span>${m[0]} <b>${x.tier}</b></span>` : "";
}
function openModal(p){
  document.getElementById("modalContent").innerHTML=`
  <img class="modal-skin" src="${escapeAttr(p.skin||skin(p.name))}" onerror="this.src='https://mc-heads.net/avatar/Steve/120'">
  <h2>${escapeHtml(p.name)}</h2>
  <p>${escapeHtml(p.combatRank||"Unranked")} · ${escapeHtml(p.region||"No region")}</p>
  <p><strong>Overall:</strong> ${p.totalPoints||0} points</p>
  <div class="modal-modes">${modes.slice(1).map(m=>{
    const x=p.modes&&p.modes[m]; return `<div><b>${m}</b><br>${x&&x.tier?x.tier:""} ${x&&x.points!=null?"· "+x.points+" pts":""}</div>`;
  }).join("")}</div>`;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function skin(n){return "https://mc-heads.net/body/"+encodeURIComponent(n)+"/120";}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return String(s??"").replace(/"/g,"&quot;");}
</script>
</body>
</html>
