<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vortex Tier — Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
}
.hidden{display:none!important}
button,input,select{font:inherit}
button{cursor:pointer}

.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-box{
  width:100%;
  max-width:410px;
  background:#101010;
  border:1px solid #292929;
  border-radius:18px;
  padding:30px;
}
.logo{
  font-size:28px;
  font-weight:900;
}
.muted{
  color:#888;
  font-size:13px;
}
.login-box .muted{
  margin:7px 0 25px;
}
label{
  display:block;
  color:#aaa;
  font-size:13px;
  font-weight:700;
  margin:0 0 7px;
}
input,select{
  width:100%;
  background:#080808;
  color:#fff;
  border:1px solid #303030;
  border-radius:10px;
  padding:12px 13px;
  outline:none;
}
input:focus,select:focus{
  border-color:#666;
}
.btn{
  border:1px solid #333;
  background:#181818;
  color:#fff;
  padding:11px 15px;
  border-radius:10px;
  font-weight:800;
}
.btn.primary{
  background:#fff;
  color:#000;
  border-color:#fff;
}
.btn.danger{
  color:#ff6666;
}
.login-btn{
  width:100%;
  margin-top:14px;
}
.error{
  display:none;
  color:#ff6868;
  font-size:13px;
  margin-top:10px;
}

.admin{
  max-width:1200px;
  margin:auto;
  padding:25px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:22px;
}
.topbar h1{
  margin:0;
  font-size:28px;
}
.card{
  background:#101010;
  border:1px solid #282828;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px;
}
.card h2{
  margin:0 0 18px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}
.full{
  grid-column:1/-1;
}
.field{
  margin-bottom:2px;
}

.mode-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:15px;
}
.mode-box{
  background:#080808;
  border:1px solid #252525;
  border-radius:12px;
  padding:14px;
}
.mode-title{
  font-size:15px;
  font-weight:900;
  margin-bottom:11px;
}
.mode-box input{
  margin-top:8px;
}

.form-buttons{
  display:flex;
  gap:9px;
  margin-top:18px;
  flex-wrap:wrap;
}

.status{
  margin-top:12px;
  font-size:13px;
  color:#79ff91;
}

.search{
  margin-bottom:15px;
}

.player-list{
  display:grid;
  gap:10px;
}
.player{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  background:#080808;
  border:1px solid #252525;
  border-radius:12px;
  padding:14px;
}
.player-name{
  font-weight:900;
}
.player-meta{
  color:#888;
  font-size:12px;
  margin-top:4px;
}
.actions{
  display:flex;
  gap:8px;
}
.empty{
  color:#777;
  padding:15px 0;
}

.download-box{
  border:1px solid #292929;
  background:#080808;
  border-radius:12px;
  padding:15px;
  margin-top:20px;
}
.download-box p{
  color:#888;
  font-size:13px;
  line-height:1.5;
  margin:7px 0 14px;
}

@media(max-width:700px){
  .admin{padding:15px}
  .grid,.mode-grid{
    grid-template-columns:1fr;
  }
  .player{
    align-items:flex-start;
    flex-direction:column;
  }
  .actions{
    width:100%;
  }
  .actions button{
    flex:1;
  }
  .topbar{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
====================================================== -->

<section id="loginPage" class="login-wrap">

  <div class="login-box">

    <div class="logo">Vortex Tier</div>

    <div class="muted">
      Administrator Login
    </div>

    <form id="loginForm">

      <label>Admin Password</label>

      <input
        id="passwordInput"
        type="password"
        placeholder="Enter password"
        autocomplete="off"
        required
      >

      <button class="btn primary login-btn" type="submit">
        Login
      </button>

      <div id="loginError" class="error">
        Incorrect password.
      </div>

    </form>

  </div>

</section>


<!-- =====================================================
     ADMIN PANEL
====================================================== -->

<main id="adminPanel" class="admin hidden">

  <div class="topbar">

    <div>
      <h1>Admin Panel</h1>
      <div class="muted">
        Vortex Tier Management
      </div>
    </div>

    <button id="logoutBtn" class="btn">
      Logout
    </button>

  </div>


  <!-- ===================================================
       ADD / EDIT PLAYER
  ==================================================== -->

  <section class="card">

    <h2 id="formTitle">
      Add Player
    </h2>

    <form id="playerForm">

      <input
        type="hidden"
        id="editIndex"
        value=""
      >

      <div class="grid">

        <div class="field">
          <label>Player Name</label>

          <input
            id="playerName"
            type="text"
            placeholder="Minecraft username"
            required
          >
        </div>


        <div class="field">
          <label>Region</label>

          <input
            id="playerRegion"
            type="text"
            placeholder="e.g. AS"
          >
        </div>


        <div class="field">
          <label>Skin URL</label>

          <input
            id="playerSkin"
            type="text"
            placeholder="Optional skin image URL"
          >
        </div>


        <div class="field">
          <label>NameMC URL</label>

          <input
            id="playerNamemc"
            type="text"
            placeholder="Optional NameMC URL"
          >
        </div>

      </div>


      <h3 style="margin-top:25px">
        Gamemode Results
      </h3>

      <div id="modeGrid" class="mode-grid"></div>


      <div class="form-buttons">

        <button
          type="submit"
          class="btn primary"
        >
          Save Player
        </button>

        <button
          type="button"
          id="cancelEdit"
          class="btn hidden"
        >
          Cancel Edit
        </button>

      </div>

      <div id="saveStatus" class="status"></div>

    </form>


    <!-- DOWNLOAD APP.JS -->

    <div class="download-box">

      <strong>
        Update Rankings Website
      </strong>

      <p>
        After adding or editing players, download the
        updated <b>app.js</b> and replace the old
        app.js on your website.
      </p>

      <button
        id="downloadAppBtn"
        class="btn primary"
      >
        Download Updated app.js
      </button>

    </div>

  </section>


  <!-- ===================================================
       PLAYER SEARCH / LIST
  ==================================================== -->

  <section class="card">

    <h2>
      Players
    </h2>

    <input
      id="playerSearch"
      class="search"
      type="search"
      placeholder="Search player name..."
      autocomplete="off"
    >

    <div
      id="playerList"
      class="player-list"
    ></div>

  </section>

</main>


<script>

/* =====================================================
   CONFIG
====================================================== */

/*
  CHANGE THIS TO YOUR ADMIN PASSWORD
*/
const ADMIN_PASSWORD = "vortexadmin123";


/* =====================================================
   MODES
====================================================== */

const MODES = [
  { id:"vanilla", name:"Vanilla" },
  { id:"uhc",     name:"UHC" },
  { id:"pot",     name:"Pot" },
  { id:"nethop",  name:"NetHop" },
  { id:"smp",     name:"SMP" },
  { id:"sword",   name:"Sword" },
  { id:"axe",     name:"Axe" },
  { id:"mace",    name:"Mace" }
];


/* =====================================================
   ELEMENTS
====================================================== */

const loginPage =
  document.getElementById("loginPage");

const adminPanel =
  document.getElementById("adminPanel");

const loginForm =
  document.getElementById("loginForm");

const passwordInput =
  document.getElementById("passwordInput");

const loginError =
  document.getElementById("loginError");

const logoutBtn =
  document.getElementById("logoutBtn");

const playerForm =
  document.getElementById("playerForm");

const playerList =
  document.getElementById("playerList");

const playerSearch =
  document.getElementById("playerSearch");

const modeGrid =
  document.getElementById("modeGrid");

const formTitle =
  document.getElementById("formTitle");

const editIndex =
  document.getElementById("editIndex");

const playerName =
  document.getElementById("playerName");

const playerRegion =
  document.getElementById("playerRegion");

const playerSkin =
  document.getElementById("playerSkin");

const playerNamemc =
  document.getElementById("playerNamemc");

const cancelEdit =
  document.getElementById("cancelEdit");

const saveStatus =
  document.getElementById("saveStatus");

const downloadAppBtn =
  document.getElementById("downloadAppBtn");


/* =====================================================
   LOGIN
====================================================== */

/*
  IMPORTANT:
  We DO NOT use sessionStorage/localStorage
  for login.

  Therefore every time admin.html is opened,
  password will be required again.
*/

function showLogin(){

  loginPage.classList.remove("hidden");

  adminPanel.classList.add("hidden");

  passwordInput.value = "";

}


function showAdmin(){

  loginPage.classList.add("hidden");

  adminPanel.classList.remove("hidden");

  renderPlayers();

}


loginForm.addEventListener("submit", function(e){

  e.preventDefault();

  if(passwordInput.value === ADMIN_PASSWORD){

    loginError.style.display = "none";

    showAdmin();

  }else{

    loginError.style.display = "block";

    passwordInput.value = "";

    passwordInput.focus();

  }

});


logoutBtn.addEventListener("click", function(){

  showLogin();

});


/* =====================================================
   MODE FORM
====================================================== */

function createModeInputs(){

  modeGrid.innerHTML = MODES.map(mode => {

    return `
      <div class="mode-box">

        <div class="mode-title">
          ${escapeHTML(mode.name)}
        </div>

        <label>Tier</label>

        <select data-tier="${mode.id}">

          <option value="">
            Untested
          </option>

          <option value="HT1">HT1</option>
          <option value="LT1">LT1</option>

          <option value="HT2">HT2</option>
          <option value="LT2">LT2</option>

          <option value="HT3">HT3</option>
          <option value="LT3">LT3</option>

          <option value="HT4">HT4</option>
          <option value="LT4">LT4</option>

          <option value="HT5">HT5</option>
          <option value="LT5">LT5</option>

        </select>

        <label style="margin-top:10px">
          Points
        </label>

        <input
          type="number"
          min="0"
          step="1"
          placeholder="0"
          data-points="${mode.id}"
        >

      </div>
    `;

  }).join("");

}


/* =====================================================
   DATA STORAGE
====================================================== */

function getPlayers(){

  try{

    return JSON.parse(
      localStorage.getItem("vortexPlayers") || "[]"
    );

  }catch(error){

    return [];

  }

}


function savePlayers(players){

  localStorage.setItem(
    "vortexPlayers",
    JSON.stringify(players)
  );

}


/* =====================================================
   SAVE PLAYER
====================================================== */

playerForm.addEventListener("submit", function(e){

  e.preventDefault();

  const players = getPlayers();

  const name =
    playerName.value.trim();

  if(!name){
    return;
  }


  /*
    Create gamemode results
  */

  const results = {};

  MODES.forEach(mode => {

    const tierElement =
      document.querySelector(
        `[data-tier="${mode.id}"]`
      );

    const pointsElement =
      document.querySelector(
        `[data-points="${mode.id}"]`
      );

    const tier =
      tierElement.value;

    const points =
      Number(pointsElement.value || 0);


    results[mode.id] = {
      tier: tier,
      points: points
    };

  });


  const player = {

    name:name,

    region:
      playerRegion.value.trim(),

    skin:
      playerSkin.value.trim(),

    namemc:
      playerNamemc.value.trim(),

    results:results

  };


  const index =
    editIndex.value;


  /* EDIT */

  if(index !== ""){

    players[Number(index)] = player;

    saveStatus.textContent =
      "Player updated successfully.";

  }

  /* ADD */

  else{

    /*
      Prevent duplicate player names.
    */

    const exists =
      players.some(
        (p,i) =>
          i !== Number(index) &&
          String(p.name).toLowerCase() ===
          name.toLowerCase()
      );

    if(exists){

      saveStatus.style.color =
        "#ff6868";

      saveStatus.textContent =
        "This player already exists.";

      return;

    }


    players.push(player);

    saveStatus.style.color =
      "#79ff91";

    saveStatus.textContent =
      "Player added successfully.";

  }


  savePlayers(players);

  resetForm();

  renderPlayers();

});


/* =====================================================
   SEARCH
====================================================== */

playerSearch.addEventListener(
  "input",
  renderPlayers
);


/* =====================================================
   RENDER PLAYER LIST
====================================================== */

function renderPlayers(){

  const players =
    getPlayers();

  const search =
    playerSearch.value
      .trim()
      .toLowerCase();


  const filtered =
    players
      .map((player,index) => ({
        player,
        index
      }))
      .filter(item => {

        if(!search){
          return true;
        }

        return String(
          item.player.name || ""
        )
        .toLowerCase()
        .includes(search);

      });


  if(filtered.length === 0){

    playerList.innerHTML = `
      <div class="empty">
        No players found.
      </div>
    `;

    return;

  }


  playerList.innerHTML =
    filtered.map(item => {

      const player =
        item.player;

      const index =
        item.index;


      return `

        <div class="player">

          <div>

            <div class="player-name">
              ${escapeHTML(player.name)}
            </div>

            <div class="player-meta">
              ${escapeHTML(
                player.region || "No region"
              )}
            </div>

          </div>

          <div class="actions">

            <button
              class="btn"
              onclick="editPlayer(${index})"
            >
              Edit
            </button>

            <button
              class="btn danger"
              onclick="deletePlayer(${index})"
            >
              Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   EDIT PLAYER
====================================================== */

window.editPlayer = function(index){

  const players =
    getPlayers();

  const player =
    players[index];

  if(!player){
    return;
  }


  editIndex.value =
    index;

  playerName.value =
    player.name || "";

  playerRegion.value =
    player.region || "";

  playerSkin.value =
    player.skin || "";

  playerNamemc.value =
    player.namemc || "";


  MODES.forEach(mode => {

    const result =
      player.results?.[mode.id] || {};


    const tierElement =
      document.querySelector(
        `[data-tier="${mode.id}"]`
      );

    const pointsElement =
      document.querySelector(
        `[data-points="${mode.id}"]`
      );


    tierElement.value =
      result.tier || "";

    pointsElement.value =
      result.points ?? "";

  });


  formTitle.textContent =
    "Edit Player";

  cancelEdit.classList.remove(
    "hidden"
  );

  saveStatus.textContent = "";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


/* =====================================================
   DELETE PLAYER
====================================================== */

window.deletePlayer = function(index){

  const players =
    getPlayers();

  const player =
    players[index];

  if(!player){
    return;
  }


  const ok =
    confirm(
      `Delete ${player.name}?`
    );

  if(!ok){
    return;
  }


  players.splice(index,1);

  savePlayers(players);

  renderPlayers();

};


/* =====================================================
   CANCEL EDIT
====================================================== */

cancelEdit.addEventListener(
  "click",
  resetForm
);


function resetForm(){

  playerForm.reset();

  editIndex.value = "";

  formTitle.textContent =
    "Add Player";

  cancelEdit.classList.add(
    "hidden"
  );

}


/* =====================================================
   DOWNLOAD UPDATED APP.JS
====================================================== */

/*
  This creates a new app.js containing all
  current player data.

  Replace your old app.js with the downloaded file.
*/

downloadAppBtn.addEventListener(
  "click",
  downloadApp
);


function downloadApp(){

  const players =
    getPlayers();


  /*
    Keep the player data inside VORTEX_DATA.
    Your existing frontend can read this data.
  */

  const appCode = `/* =====================================================
   VORTEX TIER — GENERATED APP.JS
   Generated from Admin Panel
====================================================== */

const VORTEX_DATA = ${JSON.stringify(
  {
    players:players
  },
  null,
  2
)};

/*
  The player database above was generated by
  Vortex Tier Admin Panel.

  IMPORTANT:
  Keep your existing Vortex frontend rendering
  functions below this data section.
*/
`;


  const blob =
    new Blob(
      [appCode],
      {
        type:"application/javascript"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "app.js";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);


  saveStatus.style.color =
    "#79ff91";

  saveStatus.textContent =
    "Updated app.js downloaded.";

}


/* =====================================================
   ESCAPE HTML
====================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   INITIALIZE
====================================================== */

createModeInputs();

/*
  ALWAYS SHOW LOGIN.
  No saved login session.
*/

showLogin();

</script>

</body>
</html>
