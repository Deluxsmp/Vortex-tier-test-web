<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vortex Tier Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="admin-page">
  <section id="login" class="admin-card">
    <h1>Vortex Tier Admin</h1>
    <p>Enter the admin password.</p>
    <input id="password" type="password" placeholder="Password">
    <button class="button" onclick="login()">Login</button>
    <p id="loginMsg"></p>
  </section>

  <section id="panel" class="hidden">
    <div class="admin-head"><h1>Player Manager</h1><button onclick="logout()">Logout</button></div>
    <div class="admin-card">
      <input id="name" placeholder="Minecraft username">
      <input id="region" placeholder="Region">
      <input id="skin" placeholder="Custom skin/body URL (optional)">
      <div class="form-grid" id="modeFields"></div>
      <button class="button" onclick="savePlayer()">Save Player</button>
      <button onclick="clearForm()">New Player</button>
    </div>
    <div class="admin-card">
      <h2>Players</h2>
      <div id="players"></div>
      <hr>
      <p><b>After saving:</b> click “Download updated app.js”, replace the old app.js in your website files, then redeploy.</p>
      <button class="button" onclick="downloadApp()">Download updated app.js</button>
    </div>
  </section>
</main>
<script src="app.js"></script>
<script>
const ADMIN_PASSWORD = "CHANGE_THIS_PASSWORD";
const MODES = ["Vanilla","UHC","Pot","NetHop","SMP","Sword","Axe","Mace"];
let editing=-1;
let data=JSON.parse(JSON.stringify(VORTEX_PLAYERS));

const fields=document.getElementById("modeFields");
fields.innerHTML=MODES.map(m=>`<div class="mode-field"><label>${m}</label><input id="tier_${m}" placeholder="HT1 / LT1 / blank"><input id="pts_${m}" type="number" placeholder="Points"></div>`).join("");
renderPlayers();

function login(){
  if(document.getElementById("password").value===ADMIN_PASSWORD){
    sessionStorage.setItem("vortex_admin","1");
    document.getElementById("login").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
  }else document.getElementById("loginMsg").textContent="Wrong password.";
}
if(sessionStorage.getItem("vortex_admin")==="1"){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
}
function logout(){sessionStorage.removeItem("vortex_admin");location.reload();}
function savePlayer(){
  const name=document.getElementById("name").value.trim();
  if(!name)return alert("Enter a player name.");
  const p={name,region:document.getElementById("region").value.trim(),skin:document.getElementById("skin").value.trim(),modes:{}};
  MODES.forEach(m=>{
    const tier=document.getElementById("tier_"+m).value.trim().toUpperCase();
    const points=Number(document.getElementById("pts_"+m).value||0);
    if(tier||points) p.modes[m]={tier,points};
  });
  p.totalPoints=MODES.reduce((s,m)=>s+(p.modes[m]?.points||0),0);
  p.combatRank=p.totalPoints<=0?"":(data.length===0?"Combat Grandmaster":"Combat Ace");
  const found=data.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
  if(found>=0)data[found]=p; else data.push(p);
  data.sort((a,b)=>b.totalPoints-a.totalPoints);
  data.forEach((x,i)=>x.combatRank=i===0?"Combat Grandmaster":i<3?"Combat Master":"Combat Ace");
  clearForm();renderPlayers();
}
function edit(i){
  const p=data[i]; editing=i;
  document.getElementById("name").value=p.name||"";
  document.getElementById("region").value=p.region||"";
  document.getElementById("skin").value=p.skin||"";
  MODES.forEach(m=>{
    document.getElementById("tier_"+m).value=p.modes?.[m]?.tier||"";
    document.getElementById("pts_"+m).value=p.modes?.[m]?.points??"";
  });
  scrollTo(0,0);
}
function removePlayer(i){if(confirm("Delete "+data[i].name+"?")){data.splice(i,1);data.forEach((x,j)=>x.combatRank=j===0?"Combat Grandmaster":j<3?"Combat Master":"Combat Ace");renderPlayers();}}
function clearForm(){editing=-1;["name","region","skin"].forEach(id=>document.getElementById(id).value="");MODES.forEach(m=>{document.getElementById("tier_"+m).value="";document.getElementById("pts_"+m).value=""});}
function renderPlayers(){
 document.getElementById("players").innerHTML=data.map((p,i)=>`<div class="admin-player"><span>${escapeHtml(p.name)} — ${p.totalPoints||0} pts</span><span><button onclick="edit(${i})">Edit</button> <button onclick="removePlayer(${i})">Delete</button></span></div>`).join("");
}
function downloadApp(){
  const source=`// Vortex Tier player data — generated by Admin Panel
const VORTEX_PLAYERS = ${JSON.stringify(data,null,2)};
`;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([source],{type:"text/javascript"}));a.download="app.js";a.click();URL.revokeObjectURL(a.href);
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body>
</html>
